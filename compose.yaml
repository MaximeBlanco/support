services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: support/app
        environment:
            CONTAINER_ROLE: app
        ports:
            - '${APP_PORT:-8080}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        volumes:
            - '.:/var/www/html'
        networks:
            - support
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_started
            mailpit:
                condition: service_started

    queue:
        image: support/app
        environment:
            CONTAINER_ROLE: worker
        command: ['php', 'artisan', 'queue:work', '--tries=3', '--sleep=1']
        volumes:
            - '.:/var/www/html'
        networks:
            - support
        restart: unless-stopped
        depends_on:
            - app

    reverb:
        image: support/app
        environment:
            CONTAINER_ROLE: worker
        command: ['php', 'artisan', 'reverb:start', '--host=0.0.0.0', '--port=8080']
        ports:
            - '${REVERB_FORWARD_PORT:-8081}:8080'
        volumes:
            - '.:/var/www/html'
        networks:
            - support
        restart: unless-stopped
        depends_on:
            - app

    mysql:
        image: 'mysql:8.4'
        ports:
            - '${FORWARD_DB_PORT:-33060}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD:-password}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE:-support}'
            MYSQL_USER: '${DB_USERNAME:-sail}'
            MYSQL_PASSWORD: '${DB_PASSWORD:-password}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'support-mysql:/var/lib/mysql'
            - './docker/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - support
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-p${DB_PASSWORD:-password}']
            retries: 10
            timeout: 5s
            interval: 5s

    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'support-redis:/data'
        networks:
            - support
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            retries: 10
            timeout: 5s

    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - support

networks:
    support:
        driver: bridge

volumes:
    support-mysql:
        driver: local
    support-redis:
        driver: local
