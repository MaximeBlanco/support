opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.jit=tracing
opcache.jit_buffer_size=64M

; Revalidating means stat()-ing every file on every request, which is exactly
; what is slow over a bind mount. Two seconds is short enough that an edit shows
; up while you are still looking at the screen, and long enough to spare the
; filesystem thousands of round trips.
opcache.validate_timestamps=1
opcache.revalidate_freq=2

; The path cache is what makes `require` cheap when the file lives on the host.
opcache.max_file_size=0
opcache.file_cache=/tmp/opcache
opcache.file_cache_only=0
